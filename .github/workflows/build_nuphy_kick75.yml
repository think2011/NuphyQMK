---
name: Build NuPhy Kick75 Firmware

'on':
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'keyboards/nuphy/kick75/**'
      - '.github/kick75-requirements.txt'
      - '.github/workflows/build_nuphy_kick75.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kick75-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile nuphy/kick75/ansi:via
    runs-on: ubuntu-latest
    container:
      image: >-
        ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a

    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install legacy Python dependency
        run: >-
          /opt/uv/tools/qmk/bin/python3 -m pip install
          --disable-pip-version-check --require-hashes
          -r .github/kick75-requirements.txt

      - name: Deploy submodules
        run: qmk git-submodule -f

      - name: Compile firmware
        run: qmk compile -kb nuphy/kick75/ansi -km via

      - name: Save firmware
        uses: >-
          actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware
          path: '*.bin'
          if-no-files-found: error
