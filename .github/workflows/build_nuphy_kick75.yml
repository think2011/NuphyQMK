name: Build NuPhy Kick75 Firmware

on:
  push:
    branches: [main]
    paths:
      - 'keyboards/nuphy/kick75/**'
      - '.github/workflows/build_nuphy_kick75.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile nuphy/kick75/ansi:via
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

      - name: Deploy submodules
        run: qmk git-submodule -f

      - name: Compile firmware
        run: qmk compile -kb nuphy/kick75/ansi -km via

      - name: Save firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: "*.bin"

  release:
    name: Publish firmware to Releases
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete firmware-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create firmware-latest firmware/*.bin \
            --title "NuPhy Kick75 Latest Firmware" \
            --prerelease \
            --notes "Built from \`${{ github.sha }}\`"
