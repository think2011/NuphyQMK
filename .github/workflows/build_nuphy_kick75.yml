name: Build NuPhy Kick75 Firmware

on:
  push:
    branches: [main]
    paths:
      - 'keyboards/nuphy/kick75/**'
      - '.github/workflows/build_nuphy_kick75.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile nuphy/kick75/ansi:via
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Disable safe.directory check
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy submodules
        run: qmk git-submodule -f

      - name: Compile firmware
        run: qmk compile -kb nuphy/kick75/ansi -km via

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: nuphy_kick75_ansi_via
          path: |
            *.bin
            *.hex
            *.uf2
